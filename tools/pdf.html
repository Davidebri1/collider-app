<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF</title>
<link rel="stylesheet" href="glass.css">
<style>
 body{display:flex;flex-direction:column;background:rgba(28,28,30,.55)}
 #top{border-bottom:1px solid var(--line)}
 #main{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
 #pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 8px 40px}
 .pg{position:relative;box-shadow:0 6px 24px rgba(0,0,0,.35);background:#fff;flex:none}
 .pg canvas{display:block}
 .pg svg{position:absolute;left:0;top:0;touch-action:none}
 .pg .forms{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
 .pg .forms *{pointer-events:auto}
 .pg .forms input[type=text],.pg .forms textarea,.pg .forms select{position:absolute;border:1px solid rgba(10,132,255,.6);background:rgba(10,132,255,.08);color:#000;font:12px Helvetica,Arial;padding:0 2px;outline:none;border-radius:2px}
 .pg .forms input[type=checkbox]{position:absolute;margin:0;accent-color:#0A84FF}
 .pg .lbl{position:absolute;left:-2px;top:-20px;color:var(--fg3);font-size:11px}
 .tbox{position:absolute;min-width:20px;outline:1px dashed rgba(10,132,255,.9);color:#000;white-space:pre;font-family:Helvetica,Arial;line-height:1.15;padding:0 1px;background:transparent}
 #strip{display:none;position:absolute;inset:0;overflow:auto;padding:12px;background:rgba(20,20,22,.6)}
 #strip.on{display:block}
 #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
 .th{background:var(--glass2);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
 .th.sel{outline:2px solid #fff}
 .th canvas{background:#fff;max-width:100%;box-shadow:0 2px 8px rgba(0,0,0,.4)}
 .th .ops{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
 .th .ops button{height:26px;min-width:26px;border-radius:13px;border:0;background:var(--glass3);color:#fff;cursor:pointer;padding:0 7px;font-weight:700}
 #sw{display:flex;gap:4px}
 #sw i{width:20px;height:20px;border-radius:10px;display:inline-block;cursor:pointer;border:2px solid transparent}
 #sw i.on{border-color:#fff}
 #status{padding:4px 12px;color:var(--fg3);font-size:12px;border-top:1px solid var(--line);display:flex;gap:12px}
</style></head><body>
<div id="top" class="bar">
  <button class="btn on" data-tool="select" title="Select / fill forms"><span class="i">↖</span>Select</button>
  <button class="btn" data-tool="edit" title="Edit text"><span class="i">✎</span>Edit text</button>
  <button class="btn" data-tool="hl" title="Highlight"><span class="i">▮</span>Highlight</button>
  <button class="btn" data-tool="ink" title="Ink"><span class="i">〰</span>Ink</button>
  <button class="btn" data-tool="text" title="Text box"><span class="i">T</span>Text</button>
  <button class="btn" data-tool="erase" title="Erase an annotation"><span class="i">⌫</span>Erase</button>
  <span id="sw"></span>
  <span class="sep"></span>
  <button class="btn" id="undo">↶ Undo</button>
  <button class="btn" id="zo">−</button><button class="btn" id="zi">+</button>
  <button class="btn" id="pagesBtn">▦ Pages</button>
  <span class="sep"></span>
  <button class="btn blue" id="saveBtn">Save</button>
  <button class="btn" id="expBtn">Export PDF</button>
  <input type="file" id="ins" accept="application/pdf" hidden>
  <input type="file" id="openLocal" accept="application/pdf" hidden>
</div>
<div id="main">
  <div id="pages"></div>
  <div id="strip"><div class="bar" style="padding:0 0 10px">
     <button class="btn" id="addBlank">+ Blank page</button><button class="btn" id="addPdf">+ Insert PDF…</button>
     <span class="muted" id="stripInfo"></span></div><div id="grid"></div></div>
  <div class="empty" id="empty"><div style="font-size:15px">No PDF open</div><button class="btn" onclick="document.getElementById('openLocal').click()">Open a PDF…</button></div>
</div>
<div id="status"><span id="st1"></span><span id="st2"></span></div>
<script src="bridge.js"></script>
<script src="../vendor/pdf-lib.min.js"></script>
<script type="module">
import * as pdfjsLib from '../vendor/pdfjs/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('../vendor/pdfjs/pdf.worker.min.mjs', import.meta.url).href;
const STD = new URL('../vendor/pdfjs/standard_fonts/', import.meta.url).href;
const { PDFDocument, rgb, degrees, StandardFonts, BlendMode } = PDFLib;
const $ = (id) => document.getElementById(id);
const COLORS = ['#FFD60A', '#FF453A', '#0A84FF', '#30D158', '#000000'];
let color = COLORS[0];
let tool = 'select', scale = 1, name = 'document.pdf';
let srcs = [];          // [{bytes, doc (pdfjs), lib (pdf-lib, lazy), fields:[]}]
let pages = [];         // [{uid, s, i, rot, w, h}]  s=-1 blank
let ann = [];           // annotations in source-page PDF space, keyed by page uid
let undo = [];
let selThumb = -1, uidSeq = 1, annSeq = 1, structural = false;
const formValues = {};  // fieldName -> value

// colour swatches
for (const c of COLORS) { const i = document.createElement('i'); i.style.background = c; if (c === color) i.className = 'on';
  i.onclick = () => { color = c; [...$('sw').children].forEach((x) => x.classList.toggle('on', x === i)); }; $('sw').appendChild(i); }
document.querySelectorAll('[data-tool]').forEach((b) => b.onclick = () => { tool = b.dataset.tool;
  document.querySelectorAll('[data-tool]').forEach((x) => x.classList.toggle('on', x === b)); status(); });

function snap() { undo.push(JSON.stringify({ ann, pages, structural })); if (undo.length > 80) undo.shift(); }
$('undo').onclick = () => { const s = undo.pop(); if (!s) return; const o = JSON.parse(s); ann = o.ann; pages = o.pages; structural = o.structural; renderAll(); };
$('zi').onclick = () => { scale = Math.min(3, scale * 1.2); renderAll(); };
$('zo').onclick = () => { scale = Math.max(0.3, scale / 1.2); renderAll(); };
$('pagesBtn').onclick = () => { $('strip').classList.toggle('on'); $('pagesBtn').classList.toggle('on'); if ($('strip').classList.contains('on')) renderStrip(); };
$('openLocal').onchange = async (e) => { const f = e.target.files[0]; if (f) openBytes(await cBytesFromFile(f), f.name); };

function status() {
  $('st1').textContent = pages.length ? `${pages.length} page${pages.length > 1 ? 's' : ''} · ${Math.round(scale * 100)}%` : '';
  const hints = { select: 'Tap form fields to fill them', edit: 'Tap a line of text to change it', hl: 'Drag over text to highlight', ink: 'Draw with your finger or pen', text: 'Tap where the text box goes', erase: 'Tap an annotation to remove it' };
  $('st2').textContent = (srcs[0] && srcs[0].fields.length ? `${srcs[0].fields.length} form fields · ` : '') + hints[tool];
}

async function openBytes(bytes, n) {
  name = n || name;
  const copy = bytes.slice();
  const doc = await pdfjsLib.getDocument({ data: copy, standardFontDataUrl: STD }).promise;
  srcs = [{ bytes, doc, fields: [] }];
  pages = []; ann = []; undo = []; structural = false;
  for (let i = 0; i < doc.numPages; i++) pages.push({ uid: uidSeq++, s: 0, i, rot: 0 });
  try { await readFields(0); } catch (e) { console.warn('fields', e); }
  // auto-fit width
  const p1 = await doc.getPage(1); const vw = p1.getViewport({ scale: 1 }).width;
  scale = Math.max(0.4, Math.min(1.6, ($('main').clientWidth - 24) / vw));
  $('empty').style.display = 'none';
  renderAll();
}

async function libOf(s) { if (!srcs[s].lib) srcs[s].lib = await PDFDocument.load(srcs[s].bytes, { ignoreEncryption: true }); return srcs[s].lib; }

async function readFields(s) {
  const lib = await libOf(s); const form = lib.getForm(); const out = [];
  const pgs = lib.getPages();
  for (const f of form.getFields()) {
    const type = f instanceof PDFLib.PDFTextField ? 'PDFTextField' : f instanceof PDFLib.PDFCheckBox ? 'PDFCheckBox' : f instanceof PDFLib.PDFDropdown ? 'PDFDropdown' : f instanceof PDFLib.PDFRadioGroup ? 'PDFRadioGroup' : 'other'; const nm = f.getName();
    for (const w of f.acroField.getWidgets()) {
      const r = w.getRectangle(); let pi = -1;
      const ref = lib.context.getObjectRef(w.dict);
      if (ref) { const pg = lib.findPageForAnnotationRef(ref); if (pg) pi = pgs.indexOf(pg); }
      if (pi < 0) { const P = w.P(); if (P) pi = pgs.findIndex((p) => p.ref === P); }
      if (pi < 0) continue;
      let val = '';
      try { if (type === 'PDFTextField') val = f.getText() || ''; else if (type === 'PDFCheckBox') val = f.isChecked(); else if (type === 'PDFDropdown') val = (f.getSelected() || [])[0] || ''; else if (type === 'PDFRadioGroup') val = f.getSelected() || ''; } catch {}
      let opts = []; try { if (type === 'PDFDropdown' || type === 'PDFRadioGroup') opts = f.getOptions(); } catch {}
      let multi = false; try { multi = type === 'PDFTextField' && f.isMultiline(); } catch {}
      out.push({ name: nm, type, page: pi, rect: [r.x, r.y, r.x + r.width, r.y + r.height], opts, multi, onValue: type === 'PDFRadioGroup' ? (w.getOnValue && w.getOnValue() ? w.getOnValue().decodeText() : '') : '' });
      if (!(nm in formValues)) formValues[nm] = val;
    }
  }
  srcs[s].fields = out;
}

function blankViewport(e, sc) { return new pdfjsLib.PageViewport({ viewBox: [0, 0, e.w, e.h], scale: sc, rotation: e.rot % 360, offsetX: 0, offsetY: 0 }); }
async function viewportOf(e, sc) {
  if (e.s < 0) return { vp: blankViewport(e, sc), page: null };
  const page = await srcs[e.s].doc.getPage(e.i + 1);
  return { vp: page.getViewport({ scale: sc, rotation: (page.rotate + e.rot) % 360 }), page };
}

let renderToken = 0;
async function renderAll() {
  const tok = ++renderToken; const host = $('pages'); host.innerHTML = ''; status();
  for (const e of pages) {
    const { vp, page } = await viewportOf(e, scale); if (tok !== renderToken) return;
    const div = document.createElement('div'); div.className = 'pg'; div.style.width = vp.width + 'px'; div.style.height = vp.height + 'px';
    const cv = document.createElement('canvas'); const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr); cv.style.width = vp.width + 'px'; cv.style.height = vp.height + 'px';
    div.appendChild(cv); host.appendChild(div);
    const ctx = cv.getContext('2d');
    if (page) { page.render({ canvasContext: ctx, viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }); }
    else { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); }
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('width', vp.width); svg.setAttribute('height', vp.height);
    div.appendChild(svg);
    const forms = document.createElement('div'); forms.className = 'forms'; div.appendChild(forms);
    div._e = e; div._vp = vp; div._page = page;
    drawAnn(div); drawForms(div); wire(div);
  }
}

const P = (vp, x, y) => vp.convertToViewportPoint(x, y);
const Q = (vp, x, y) => vp.convertToPdfPoint(x, y);
function rectVp(vp, r) { const a = P(vp, r[0], r[1]), b = P(vp, r[2], r[3]); return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1])]; }

function drawAnn(div) {
  const svg = div.querySelector('svg'); const vp = div._vp; const e = div._e;
  svg.innerHTML = ''; div.querySelectorAll('.tbox.view').forEach((x) => x.remove());
  for (const a of ann.filter((a) => a.uid === e.uid)) {
    let el;
    if (a.type === 'hl' || a.type === 'edit') {
      const [x, y, w, h] = rectVp(vp, a.rect);
      el = document.createElementNS(svg.namespaceURI, 'rect'); el.setAttribute('x', x); el.setAttribute('y', y); el.setAttribute('width', w); el.setAttribute('height', h);
      el.setAttribute('fill', a.type === 'edit' ? '#fff' : a.color); if (a.type === 'hl') { el.setAttribute('fill-opacity', '0.38'); el.style.mixBlendMode = 'multiply'; }
      svg.appendChild(el);
      if (a.type === 'edit') { const t = document.createElementNS(svg.namespaceURI, 'text'); const bl = P(vp, a.rect[0], a.base);
        t.setAttribute('x', bl[0]); t.setAttribute('y', bl[1]); t.setAttribute('font-size', a.size * vp.scale); t.setAttribute('font-family', 'Helvetica, Arial'); t.setAttribute('fill', '#000'); t.textContent = a.text; svg.appendChild(t); t.dataset.id = a.id; }
    } else if (a.type === 'ink') {
      el = document.createElementNS(svg.namespaceURI, 'polyline');
      el.setAttribute('points', a.pts.map((p) => P(vp, p[0], p[1]).join(',')).join(' '));
      el.setAttribute('fill', 'none'); el.setAttribute('stroke', a.color); el.setAttribute('stroke-width', a.w * vp.scale); el.setAttribute('stroke-linecap', 'round'); el.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(el);
    } else if (a.type === 'text') {
      const t = document.createElementNS(svg.namespaceURI, 'text'); const pt = P(vp, a.x, a.y);
      t.setAttribute('x', pt[0]); t.setAttribute('y', pt[1]); t.setAttribute('font-size', a.size * vp.scale); t.setAttribute('font-family', 'Helvetica, Arial'); t.setAttribute('fill', a.color);
      a.text.split('\n').forEach((ln, k) => { const s = document.createElementNS(svg.namespaceURI, 'tspan'); s.setAttribute('x', pt[0]); s.setAttribute('dy', k ? a.size * 1.15 * vp.scale : 0); s.textContent = ln || ' '; t.appendChild(s); });
      el = t; svg.appendChild(t);
    }
    if (el) el.dataset.id = a.id;
  }
}

function drawForms(div) {
  const e = div._e; const host = div.querySelector('.forms'); host.innerHTML = ''; if (e.s < 0) return;
  for (const f of srcs[e.s].fields.filter((f) => f.page === e.i)) {
    const [x, y, w, h] = rectVp(div._vp, f.rect); let el;
    if (f.type === 'PDFTextField') { el = document.createElement(f.multi ? 'textarea' : 'input'); if (!f.multi) el.type = 'text'; el.value = formValues[f.name] || ''; el.oninput = () => formValues[f.name] = el.value; el.style.fontSize = Math.max(8, Math.min(h * 0.7, 14 * div._vp.scale)) + 'px'; }
    else if (f.type === 'PDFCheckBox') { el = document.createElement('input'); el.type = 'checkbox'; el.checked = !!formValues[f.name]; el.onchange = () => formValues[f.name] = el.checked; }
    else if (f.type === 'PDFDropdown') { el = document.createElement('select'); for (const o of f.opts) { const op = document.createElement('option'); op.textContent = o; el.appendChild(op); } el.value = formValues[f.name] || ''; el.onchange = () => formValues[f.name] = el.value; }
    else if (f.type === 'PDFRadioGroup') { el = document.createElement('input'); el.type = 'checkbox'; el.style.borderRadius = '50%'; el.checked = formValues[f.name] === f.onValue; el.onchange = () => { formValues[f.name] = el.checked ? f.onValue : ''; renderAll(); }; }
    else continue;
    Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    el.title = f.name; host.appendChild(el);
  }
  host.style.pointerEvents = tool === 'select' ? 'none' : 'none';
  host.querySelectorAll('*').forEach((c) => c.style.pointerEvents = tool === 'select' ? 'auto' : 'none');
}

function wire(div) {
  const svg = div.querySelector('svg'); const vp = div._vp; const e = div._e;
  svg.style.pointerEvents = tool === 'select' ? 'none' : 'auto';
  let cur = null;
  const loc = (ev) => { const r = svg.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
  svg.onpointerdown = async (ev) => {
    const [x, y] = loc(ev);
    if (tool === 'erase') { const id = ev.target.dataset && ev.target.dataset.id; if (id) { snap(); ann = ann.filter((a) => String(a.id) !== id); drawAnn(div); } return; }
    if (tool === 'text') { placeText(div, x, y); return; }
    if (tool === 'edit') { await editTextAt(div, x, y); return; }
    svg.setPointerCapture(ev.pointerId);
    if (tool === 'hl') cur = { type: 'hl', x0: x, y0: y, x1: x, y1: y };
    if (tool === 'ink') cur = { type: 'ink', pts: [[x, y]] };
  };
  svg.onpointermove = (ev) => {
    if (!cur) return; const [x, y] = loc(ev);
    if (cur.type === 'hl') { cur.x1 = x; cur.y1 = y; preview(svg, cur); }
    else { cur.pts.push([x, y]); preview(svg, cur); }
  };
  svg.onpointerup = () => {
    if (!cur) return; snap();
    if (cur.type === 'hl') { const a = Q(vp, cur.x0, cur.y0), b = Q(vp, cur.x1, cur.y1);
      if (Math.abs(cur.x1 - cur.x0) > 3) ann.push({ id: annSeq++, uid: e.uid, type: 'hl', color, rect: [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])] }); }
    else if (cur.pts.length > 1) ann.push({ id: annSeq++, uid: e.uid, type: 'ink', color, w: 2.2, pts: cur.pts.map((p) => Q(vp, p[0], p[1])) });
    cur = null; drawAnn(div);
  };
}
function preview(svg, cur) {
  let p = svg.querySelector('.pv'); if (p) p.remove();
  if (cur.type === 'hl') { p = document.createElementNS(svg.namespaceURI, 'rect'); p.setAttribute('x', Math.min(cur.x0, cur.x1)); p.setAttribute('y', Math.min(cur.y0, cur.y1)); p.setAttribute('width', Math.abs(cur.x1 - cur.x0)); p.setAttribute('height', Math.abs(cur.y1 - cur.y0)); p.setAttribute('fill', color); p.setAttribute('fill-opacity', '.38'); }
  else { p = document.createElementNS(svg.namespaceURI, 'polyline'); p.setAttribute('points', cur.pts.map((q) => q.join(',')).join(' ')); p.setAttribute('fill', 'none'); p.setAttribute('stroke', color); p.setAttribute('stroke-width', 2.2 * scale); p.setAttribute('stroke-linecap', 'round'); }
  p.classList.add('pv'); svg.appendChild(p);
}
function placeText(div, x, y, existing) {
  const vp = div._vp; const size = 14;
  const box = document.createElement('div'); box.className = 'tbox'; box.contentEditable = 'true';
  Object.assign(box.style, { left: x + 'px', top: (y - size * vp.scale) + 'px', fontSize: size * vp.scale + 'px', color });
  div.appendChild(box); setTimeout(() => box.focus(), 0);
  box.onblur = () => { const text = box.innerText.replace(/\n$/, ''); box.remove(); if (!text.trim()) return; snap();
    const q = Q(vp, x, y); ann.push({ id: annSeq++, uid: div._e.uid, type: 'text', x: q[0], y: q[1], size, color, text }); drawAnn(div); };
}
async function editTextAt(div, x, y) {
  const page = div._page; if (!page) return; const vp = div._vp;
  const tc = await page.getTextContent();
  let hit = null;
  for (const it of tc.items) {
    if (!it.str || !it.str.trim()) continue;
    const t = it.transform; const h = Math.hypot(t[2], t[3]) || 10;
    const r = [t[4], t[5] - h * 0.25, t[4] + it.width, t[5] + h * 0.95];
    const [vx, vy, vw, vh] = rectVp(vp, r);
    if (x >= vx - 2 && x <= vx + vw + 2 && y >= vy - 2 && y <= vy + vh + 2) { hit = { it, r, h, vx, vy, vw, vh }; break; }
  }
  if (!hit) { cToast('No text there. Tap a line of text.'); return; }
  const prev = ann.find((a) => a.type === 'edit' && a.uid === div._e.uid && Math.abs(a.rect[0] - hit.r[0]) < 0.5 && Math.abs(a.base - hit.it.transform[5]) < 0.5);
  const box = document.createElement('input'); box.type = 'text'; box.value = prev ? prev.text : hit.it.str;
  Object.assign(box.style, { position: 'absolute', left: hit.vx + 'px', top: hit.vy + 'px', width: Math.max(hit.vw + 40, 80) + 'px', height: hit.vh + 'px', fontSize: hit.h * vp.scale * 0.92 + 'px', border: '1px solid #0A84FF', background: '#fff', color: '#000', fontFamily: 'Helvetica, Arial', padding: '0 1px' });
  div.appendChild(box); box.focus(); box.select();
  const done = () => { const v = box.value; box.remove(); if (v === hit.it.str && !prev) return; snap();
    if (prev) ann = ann.filter((a) => a !== prev);
    ann.push({ id: annSeq++, uid: div._e.uid, type: 'edit', rect: hit.r, base: hit.it.transform[5], size: hit.h, text: v }); drawAnn(div); };
  box.onkeydown = (k) => { if (k.key === 'Enter') box.blur(); if (k.key === 'Escape') { box.value = hit.it.str; box.blur(); } };
  box.onblur = done;
}

// ── page organiser ──
async function renderStrip() {
  const g = $('grid'); g.innerHTML = '';
  $('stripInfo').textContent = `${pages.length} pages`;
  pages.forEach(async (e, k) => {
    const card = document.createElement('div'); card.className = 'th' + (k === selThumb ? ' sel' : '');
    const cv = document.createElement('canvas'); card.appendChild(cv);
    const lab = document.createElement('div'); lab.className = 'muted'; lab.textContent = `Page ${k + 1}${e.s < 0 ? ' · blank' : ''}`; card.appendChild(lab);
    const ops = document.createElement('div'); ops.className = 'ops';
    const mk = (t, title, fn) => { const b = document.createElement('button'); b.textContent = t; b.title = title; b.onclick = (ev) => { ev.stopPropagation(); fn(); }; ops.appendChild(b); };
    mk('◀', 'Move earlier', () => move(k, -1)); mk('▶', 'Move later', () => move(k, 1));
    mk('⟳', 'Rotate', () => { snap(); e.rot = (e.rot + 90) % 360; structural = true; renderStrip(); renderAll(); });
    mk('⧉', 'Duplicate', () => { snap(); const c = { ...e, uid: uidSeq++ }; pages.splice(k + 1, 0, c); ann.filter((a) => a.uid === e.uid).forEach((a) => ann.push({ ...JSON.parse(JSON.stringify(a)), id: annSeq++, uid: c.uid })); structural = true; renderStrip(); renderAll(); });
    mk('🗑', 'Delete', () => { if (pages.length < 2) return cToast('A PDF needs at least one page'); snap(); pages.splice(k, 1); structural = true; renderStrip(); renderAll(); });
    card.appendChild(ops); card.onclick = () => { selThumb = k; renderStrip(); };
    g.appendChild(card);
    const { vp, page } = await viewportOf(e, 0.22);
    cv.width = vp.width; cv.height = vp.height;
    if (page) page.render({ canvasContext: cv.getContext('2d'), viewport: vp });
  });
}
function move(k, d) { const j = k + d; if (j < 0 || j >= pages.length) return; snap(); [pages[k], pages[j]] = [pages[j], pages[k]]; structural = true; selThumb = j; renderStrip(); renderAll(); }
$('addBlank').onclick = async () => { snap(); const at = selThumb >= 0 ? selThumb + 1 : pages.length; let w = 612, h = 792;
  if (pages[0]) { const { vp } = await viewportOf({ ...pages[0], rot: 0 }, 1); w = vp.width; h = vp.height; }
  pages.splice(at, 0, { uid: uidSeq++, s: -1, i: 0, rot: 0, w, h }); structural = true; renderStrip(); renderAll(); };
$('addPdf').onclick = () => $('ins').click();
$('ins').onchange = async (ev) => { const f = ev.target.files[0]; if (!f) return; const bytes = await cBytesFromFile(f);
  const doc = await pdfjsLib.getDocument({ data: bytes.slice(), standardFontDataUrl: STD }).promise; srcs.push({ bytes, doc, fields: [] }); const s = srcs.length - 1;
  snap(); const at = selThumb >= 0 ? selThumb + 1 : pages.length; const add = []; for (let i = 0; i < doc.numPages; i++) add.push({ uid: uidSeq++, s, i, rot: 0 });
  pages.splice(at, 0, ...add); structural = true; renderStrip(); renderAll(); cToast(`Inserted ${doc.numPages} page${doc.numPages > 1 ? 's' : ''}`); };

// ── export with pdf-lib ──
const hex = (c) => rgb(parseInt(c.slice(1, 3), 16) / 255, parseInt(c.slice(3, 5), 16) / 255, parseInt(c.slice(5, 7), 16) / 255);
const winAnsi = (s) => s.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/[^\x20-\x7E\xA0-\xFF\n]/g, '?');
async function fillForm(lib, s) {
  const form = lib.getForm();
  for (const f of srcs[s].fields) {
    const v = formValues[f.name];
    try { const fld = form.getField(f.name);
      if (f.type === 'PDFTextField') fld.setText(winAnsi(String(v || '')));
      else if (f.type === 'PDFCheckBox') v ? fld.check() : fld.uncheck();
      else if (f.type === 'PDFDropdown' && v) fld.select(v);
      else if (f.type === 'PDFRadioGroup' && v) fld.select(v);
    } catch (e) { console.warn('field', f.name, e); }
  }
  return form;
}
async function buildPdf() {
  const font = async (d) => d.embedFont(StandardFonts.Helvetica);
  let out, targets = [];
  const inPlace = !structural && srcs.length === 1;
  if (inPlace) {
    out = await PDFDocument.load(srcs[0].bytes, { ignoreEncryption: true });
    await fillForm(out, 0);
    targets = out.getPages().map((p, k) => ({ p, e: pages[k] }));
  } else {
    out = await PDFDocument.create();
    const libs = [];
    for (let s = 0; s < srcs.length; s++) { const l = await PDFDocument.load(srcs[s].bytes, { ignoreEncryption: true });
      if (srcs[s].fields.length) { const form = await fillForm(l, s); try { form.flatten(); } catch {} } libs.push(l); }
    for (const e of pages) {
      let p;
      if (e.s < 0) p = out.addPage([e.w, e.h]);
      else { [p] = await out.copyPages(libs[e.s], [e.i]); out.addPage(p); }
      if (e.rot) p.setRotation(degrees((p.getRotation().angle + e.rot) % 360));
      targets.push({ p, e });
    }
  }
  const f = await font(out);
  for (const { p, e } of targets) {
    for (const a of ann.filter((a) => a.uid === e.uid)) {
      if (a.type === 'hl') p.drawRectangle({ x: a.rect[0], y: a.rect[1], width: a.rect[2] - a.rect[0], height: a.rect[3] - a.rect[1], color: hex(a.color), opacity: 0.38, blendMode: BlendMode.Multiply });
      else if (a.type === 'ink') for (let k = 1; k < a.pts.length; k++) p.drawLine({ start: { x: a.pts[k - 1][0], y: a.pts[k - 1][1] }, end: { x: a.pts[k][0], y: a.pts[k][1] }, thickness: a.w, color: hex(a.color), lineCap: 1 });
      else if (a.type === 'text') a.text.split('\n').forEach((ln, k) => p.drawText(winAnsi(ln), { x: a.x, y: a.y - k * a.size * 1.15, size: a.size, font: f, color: hex(a.color) }));
      else if (a.type === 'edit') { p.drawRectangle({ x: a.rect[0] - 0.5, y: a.rect[1], width: a.rect[2] - a.rect[0] + 1, height: a.rect[3] - a.rect[1], color: rgb(1, 1, 1) });
        p.drawText(winAnsi(a.text), { x: a.rect[0], y: a.base, size: a.size, font: f, color: rgb(0, 0, 0) }); }
    }
  }

}
async function doSave(kind) {
  if (!pages.length) return;
  try { const bytes = await buildPdf();
    if (kind === 'download') ColliderBridge.download(name, 'application/pdf', bytes); else ColliderBridge.save(name, 'application/pdf', bytes);
    if (window.parent === window) cDownloadLocal(name, 'application/pdf', bytes);
    cToast(kind === 'download' ? 'Exported' : 'Saved to Files');
  } catch (e) { console.error(e); cToast('Could not save: ' + e.message); }
}
$('saveBtn').onclick = () => doSave('save');
$('expBtn').onclick = () => doSave('download');
ColliderBridge.on('open', (d) => openBytes(new Uint8Array(d.bytes), d.name));
ColliderBridge.on('request', (d) => doSave(d.what === 'export' ? 'download' : 'save'));
window.__pdf = { openBytes, buildPdf, get pages() { return pages; }, get ann() { return ann; }, formValues };
status();
